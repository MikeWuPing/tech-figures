<!-- 样板：16:9 封面。左侧压暗放标题，底图由 AI 生成或照片处理。
     复制到 <项目>/fig/t/ 下改名即可用。
     底图为占位路径，素材要自己放（或直接删掉 .img 这一行走深色底）。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="fig-size" content="1600x900">
<link rel="stylesheet" href="../cover.css">
</head>
<body>
<div class="cover">
  <div class="img" style="background-image:url('../_asset/cover.png')"></div>
  <div class="scrim"></div>

  <div class="inner">
    <!-- 标签：<b> 里是重点词，后面接分类 -->
    <div class="tag"><b>关键词</b> · 分类</div>
    <!-- 主标题：不超过 12 字，再长就要换行或缩字号 -->
    <h1>一句话主标题</h1>
    <div class="rule"></div>
    <!-- 副标题：两行以内，<br> 手动断行、<b> 加粗 -->
    <div class="sub">一行副标题，说明这篇文章解决什么问题。<br>第二行用 <b>加粗</b> 挑出关键处。</div>
  </div>

  <div class="bars"><i></i><i></i><i></i></div>
  <div class="by"><span class="n">作者名</span>栏目或系列名</div>
</div>
</body>
</html>
